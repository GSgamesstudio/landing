<!doctype html>
<html lang="ru"><meta charset="utf-8"><title>Ashes of Nations covers</title>
<style>body{margin:0;background:#080d12}</style>
<script>
const {writeFileSync}=require('node:fs');
const path=require('node:path');
const gold='#d8b96f',cream='#f3eee3';
function load(name){return new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=reject;image.src='stills/'+name;});}
function imageCover(ctx,image,x,y,w,h,source){
  const s=source||{x:0,y:0,w:image.width,h:image.height};
  const ratio=Math.max(w/s.w,h/s.h),sw=w/ratio,sh=h/ratio;
  const sx=s.x+(s.w-sw)/2,sy=s.y+(s.h-sh)/2;
  ctx.drawImage(image,sx,sy,sw,sh,x,y,w,h);
}
function save(canvas,name){
  const data=canvas.toDataURL('image/png').split(',')[1],output=path.join(__dirname,name);
  writeFileSync(output,Buffer.from(data,'base64'));
  return output;
}
async function renderCovers(){
  const [historic,modern]=await Promise.all([load('06-map-1914.png'),load('07-map-2026.png')]);
  const landscape=document.createElement('canvas');landscape.width=1920;landscape.height=1080;
  let ctx=landscape.getContext('2d');
  imageCover(ctx,modern,0,0,1920,1080,{x:300,y:92,w:1600,h:925});
  let shade=ctx.createLinearGradient(0,0,1920,0);
  shade.addColorStop(0,'rgba(4,9,14,.97)');shade.addColorStop(.5,'rgba(4,9,14,.75)');shade.addColorStop(1,'rgba(4,9,14,.18)');
  ctx.fillStyle=shade;ctx.fillRect(0,0,1920,1080);
  ctx.fillStyle='rgba(4,9,14,.28)';ctx.fillRect(0,0,1920,1080);
  ctx.fillStyle=gold;ctx.fillRect(140,138,115,6);
  ctx.font='bold 35px Arial';ctx.letterSpacing='7px';ctx.fillText('GRAND STRATEGY',140,220);ctx.letterSpacing='0px';
  ctx.fillStyle=cream;ctx.shadowColor='rgba(0,0,0,.75)';ctx.shadowBlur=25;
  ctx.font='bold 152px Georgia';ctx.fillText('ASHES OF',130,500);
  ctx.font='bold 179px Georgia';ctx.fillText('NATIONS',130,680);ctx.shadowBlur=0;
  ctx.fillStyle=gold;ctx.fillRect(140,733,690,5);
  ctx.font='bold 42px Arial';ctx.fillText('ПЕРЕПИШИТЕ ИСТОРИЮ НАЦИЙ',140,810);
  ctx.font='32px Arial';ctx.fillStyle=cream;ctx.fillText('ИСТОРИЧЕСКАЯ СТРАТЕГИЯ',140,910);
  const wide=save(landscape,'Ashes-of-Nations-cover-16x9.png');

  const vertical=document.createElement('canvas');vertical.width=1080;vertical.height=1920;
  ctx=vertical.getContext('2d');
  imageCover(ctx,historic,0,0,1080,960,{x:300,y:90,w:1125,h:820});
  imageCover(ctx,modern,0,960,1080,960,{x:420,y:100,w:1100,h:920});
  shade=ctx.createLinearGradient(0,0,0,1920);
  shade.addColorStop(0,'rgba(4,9,14,.55)');shade.addColorStop(.35,'rgba(4,9,14,.82)');
  shade.addColorStop(.55,'rgba(4,9,14,.95)');shade.addColorStop(1,'rgba(4,9,14,.55)');
  ctx.fillStyle=shade;ctx.fillRect(0,0,1080,1920);
  ctx.fillStyle=gold;ctx.fillRect(60,105,120,6);
  ctx.font='bold 38px Arial';ctx.letterSpacing='6px';ctx.fillText('GRAND STRATEGY',60,175);ctx.letterSpacing='0px';
  ctx.fillStyle=cream;ctx.textAlign='center';ctx.shadowColor='rgba(0,0,0,.85)';ctx.shadowBlur=27;
  ctx.font='bold 145px Georgia';ctx.fillText('ASHES OF',540,810);
  ctx.font='bold 162px Georgia';ctx.fillText('NATIONS',540,985);ctx.shadowBlur=0;
  ctx.fillStyle=gold;ctx.fillRect(225,1050,630,6);
  ctx.font='bold 42px Arial';ctx.fillText('ПЕРЕПИШИТЕ ИСТОРИЮ',540,1140);
  ctx.fillText('НАЦИЙ',540,1198);
  ctx.fillStyle=cream;ctx.font='33px Arial';ctx.fillText('ИСТОРИЧЕСКАЯ СТРАТЕГИЯ',540,1650);
  ctx.textAlign='left';
  const short=save(vertical,'Ashes-of-Nations-cover-9x16.png');
  return{wide,short};
}
window.renderCovers=renderCovers;
</script></html>
